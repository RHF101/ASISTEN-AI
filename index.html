<!doctype html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RHF Super AI — Login</title><link rel="stylesheet" href="style.css">
</head><body>
<div class="center"><div class="card">
  <div class="logo" data-i="sparkle" data-s="20"></div>
  <h1>RHF Super AI</h1><p class="sub">login pakai email + password atau Google</p>
  <div class="tabs"><button id="tL" class="on" type="button">Login</button><button id="tR" type="button">Daftar</button></div>
  <input id="email" type="email" placeholder="email / Gmail" autocomplete="email">
  <input id="pass" type="password" placeholder="password (min 6)" autocomplete="current-password">
  <button id="go" type="button">Masuk</button>
  <div class="sep">— atau —</div>
  <button id="gg" class="ghost" type="button">Lanjut dengan Google</button>
  <a href="#" id="forgot" style="font-size:13px;text-align:center">lupa password?</a>
  <div class="msg" id="msg"></div>
</div></div>
<script type="module">
import { auth } from "./js/firebase.js";
import { paintIcons } from "./js/icons.js";
import { onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
paintIcons();
const $ = (s) => document.querySelector(s);
let mode = "login";
const msg = (t) => ($("#msg").textContent = t || "");
const human = (e) => ({
  "auth/invalid-credential": "email / password salah",
  "auth/user-not-found": "akun belum ada, daftar dulu",
  "auth/wrong-password": "password salah",
  "auth/email-already-in-use": "email sudah terdaftar",
  "auth/weak-password": "password minimal 6 karakter",
  "auth/invalid-email": "format email salah",
  "auth/popup-closed-by-user": "popup ditutup",
  "auth/unauthorized-domain": "domain belum di-authorize di Firebase Console > Authentication > Settings",
  "auth/operation-not-allowed": "provider belum diaktifkan di Firebase Console"
}[e.code] || e.message);
function setMode(m) {
  mode = m;
  $("#tL").classList.toggle("on", m === "login"); $("#tR").classList.toggle("on", m === "reg");
  $("#go").textContent = m === "login" ? "Masuk" : "Daftar"; msg("");
}
$("#tL").onclick = () => setMode("login"); $("#tR").onclick = () => setMode("reg");
async function run(fn) {
  const b = $("#go"); b.disabled = true; msg("");
  try { await fn(); } catch (e) { msg(human(e)); } finally { b.disabled = false; }
}
$("#go").onclick = () => run(async () => {
  const e = $("#email").value.trim(), p = $("#pass").value;
  if (!e || !p) throw { message: "isi email dan password" };
  if (mode === "login") await signInWithEmailAndPassword(auth, e, p);
  else await createUserWithEmailAndPassword(auth, e, p);
});
$("#pass").addEventListener("keydown", (ev) => { if (ev.key === "Enter") $("#go").click(); });
$("#gg").onclick = () => run(async () => {
  const pr = new GoogleAuthProvider();
  try { await signInWithPopup(auth, pr); }
  catch (e) { if (e.code === "auth/popup-blocked") await signInWithRedirect(auth, pr); else throw e; }
});
$("#forgot").onclick = async (ev) => {
  ev.preventDefault();
  const e = $("#email").value.trim(); if (!e) return msg("isi email dulu");
  try { await sendPasswordResetEmail(auth, e); msg("link reset dikirim ke " + e); } catch (x) { msg(human(x)); }
};
getRedirectResult(auth).catch((e) => msg(human(e)));
onAuthStateChanged(auth, (u) => { if (u) location.replace("chat.html"); });
</script></body></html>
